<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Age Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>🎂 Smart Age Calculator</h1>
      <p class="subtitle">Enter your date of birth to calculate your exact age.</p>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob">

      <button id="calculateBtn">Calculate Age</button>

      <div id="result" class="result hidden">
        <h2>Your Age</h2>
        <div class="age" id="ageText"></div>
        <p id="birthdayText"></p>
        <p id="daysText"></p>
      </div>

      <p id="error" class="error"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
